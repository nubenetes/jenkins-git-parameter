apiVersion: apps/v1
kind: Deployment
metadata:
  name: jhipster-microservice
  labels:
    app.kubernetes.io/name: jhipster-microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: jhipster-microservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jhipster-microservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/nubenetes-dev-apps/jhipster-microservice:2.1.0-latest
          imagePullPolicy: IfNotPresent
          env:
            - name: OTEL_SERVICE_NAME
              value: "jhipster-microservice"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318/v1/traces"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=jhipster-microservice,service.namespace=nubenetes,deployment.environment=dev,cluster.name=ocp-dev"
            - name: CLUSTER_NAME
              value: "ocp-dev"
            - name: DEPLOYMENT_ENV
              value: "dev"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
