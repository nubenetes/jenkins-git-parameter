apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: jhipster-multi-cluster-appset
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - clusterName: ocp-dev
            clusterServer: https://kubernetes.default.svc
            targetEnv: dev
            targetNamespace: nubenetes-dev-apps
          - clusterName: ocp-staging
            clusterServer: https://api.ocp-staging.nubenetes.internal:6443
            targetEnv: staging
            targetNamespace: nubenetes-staging-apps
          - clusterName: ocp-prod
            clusterServer: https://api.ocp-prod.nubenetes.internal:6443
            targetEnv: prod
            targetNamespace: nubenetes-prod-apps
  template:
    metadata:
      name: 'jhipster-{{targetEnv}}'
      namespace: argocd
      labels:
        environment: '{{targetEnv}}'
        app: jhipster-microservice
    spec:
      project: default
      source:
        repoURL: 'https://github.com/nubenetes/jhipster-microservice.git'
        targetRevision: HEAD
        path: 'k8s/overlays/{{targetEnv}}'
      destination:
        server: '{{clusterServer}}'
        namespace: '{{targetNamespace}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
