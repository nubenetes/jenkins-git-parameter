apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jhipster-microservice-staging
  namespace: argocd
  labels:
    app.kubernetes.io/name: jhipster-microservice
    environment: staging
spec:
  project: default
  source:
    repoURL: 'https://github.com/nubenetes/jhipster-microservice.git'
    targetRevision: main
    path: k8s/overlays/staging
  destination:
    name: ocp-staging-cluster
    namespace: nubenetes-staging-apps
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
