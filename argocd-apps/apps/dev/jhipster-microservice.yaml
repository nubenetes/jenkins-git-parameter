apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jhipster-microservice-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: jhipster-microservice
    environment: dev
spec:
  project: default
  source:
    repoURL: 'https://github.com/nubenetes/jhipster-microservice.git'
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: nubenetes-dev-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
