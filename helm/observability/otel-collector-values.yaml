# ==============================================================================
# OpenTelemetry Collector Configuration for Jenkins & OpenShift Correlation
# ==============================================================================
mode: deployment

image:
  repository: "otel/opentelemetry-collector-contrib"
  tag: "0.117.0"

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    prometheus:
      config:
        scrape_configs:
          - job_name: 'jenkins'
            scrape_interval: 15s
            metrics_path: '/prometheus'
            static_configs:
              - targets: ['jenkins.jenkins.svc.cluster.local:8080']

  processors:
    batch:
      timeout: 1s
      send_batch_size: 256
    memory_limiter:
      check_interval: 1s
      limit_percentage: 75
      spike_limit_percentage: 20
    resource:
      attributes:
        - action: insert
          key: cluster.name
          value: ocp-dev

  exporters:
    logging:
      verbosity: normal
    prometheus:
      endpoint: "0.0.0.0:8889"
      namespace: "jenkins_otel"

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch, resource]
        exporters: [logging]
      metrics:
        receivers: [otlp, prometheus]
        processors: [memory_limiter, batch, resource]
        exporters: [prometheus, logging]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [logging]

ports:
  otlp-grpc:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  metrics:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP
