# ==============================================================================
# OpenShift Container Platform 4.20+ / Kubernetes Image Signature Policy
# Enforces Cosign signature verification on STAGING and PROD namespaces
# ==============================================================================
apiVersion: config.openshift.io/v1
kind: Image
metadata:
  name: cluster
spec:
  allowedRegistriesForImport:
    - domainName: image-registry.openshift-image-registry.svc:5000
      insecure: false
  signaturePolicy:
    default:
      - type: reject
    transports:
      atomic:
        image-registry.openshift-image-registry.svc:5000/nubenetes-dev-apps:
          - type: insecureAcceptAnything
        image-registry.openshift-image-registry.svc:5000/nubenetes-staging-apps:
          - type: signedBy
            keyType: GPGKeys # Or Cosign public key reference
            keyPath: /etc/pki/cosign/cosign-staging.pub
        image-registry.openshift-image-registry.svc:5000/nubenetes-prod-apps:
          - type: signedBy
            keyType: GPGKeys
            keyPath: /etc/pki/cosign/cosign-prod.pub
      docker:
        image-registry.openshift-image-registry.svc:5000/nubenetes-prod-apps:
          - type: signedBy
            keyType: GPGKeys
            keyPath: /etc/pki/cosign/cosign-prod.pub
