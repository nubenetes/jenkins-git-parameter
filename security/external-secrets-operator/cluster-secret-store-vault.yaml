# ==============================================================================
# External Secrets Operator: ClusterSecretStore for HashiCorp Vault
# OpenShift 4.20+ Native ServiceAccount Kubernetes Auth
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: hashicorp-vault-backend
spec:
  provider:
    vault:
      server: "https://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "nubenetes-workloads"
          serviceAccountRef:
            name: eso-vault-auth-sa
            namespace: external-secrets
