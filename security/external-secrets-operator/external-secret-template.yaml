# ==============================================================================
# Declarative ExternalSecret Custom Resource Template
# Replaces plaintext secrets in Git with dynamic Vault references
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jhipster-microservice-secrets
  namespace: nubenetes-prod-apps
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: hashicorp-vault-backend
    kind: ClusterSecretStore
  target:
    name: jhipster-database-credentials
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: secret/data/prod/jhipster
        property: db_user
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: secret/data/prod/jhipster
        property: db_password
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: secret/data/prod/jhipster
        property: jwt_secret
