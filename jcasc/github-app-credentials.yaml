# ==============================================================================
# Jenkins Configuration as Code (JCasC): GitHub App Authentication
# Short-lived, self-rotating tokens (replaces static PATs)
# ==============================================================================
credentials:
  system:
    domainCredentials:
      - credentials:
          - githubApp:
              scope: GLOBAL
              id: "github-app-nubenetes"
              description: "GitHub App Credentials for nubenetes organization"
              appID: "${GITHUB_APP_ID:-123456}"
              privateKey: "${GITHUB_APP_PRIVATE_KEY}"
              apiUri: "https://api.github.com"
